name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "android-port" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Android Platform 35 and NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          chmod +x packaging/android/build_apk.sh
          PROFILE=release ./packaging/android/build_apk.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-apk
          path: target/android/horizon.apk
